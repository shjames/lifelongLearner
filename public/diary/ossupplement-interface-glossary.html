var app = document.getElementById('app');
var hintEl = document.getElementById('hint');
var hintTimer = null;

function toast(msg) {
  hintEl.textContent = msg;
  hintEl.className = 'hint show';
  clearTimeout(hintTimer);
  hintTimer = setTimeout(function(){ hintEl.className = 'hint'; }, 1400);
}

function flash(btn, text) {
  if (!btn) return;
  if (!btn.getAttribute('data-label')) btn.setAttribute('data-label', btn.textContent);
  btn.textContent = text;
  btn.className = 'btn ok';
  setTimeout(function(){
    btn.textContent = btn.getAttribute('data-label');
    btn.className = 'btn';
  }, 1200);
}

function fallbackCopy(text, done) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.top = '-9999px';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, text.length);
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  if (ok) { done(); } else { toast('复制失败，请长按文字手动选择'); }
}

function copyText(text, done) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text, done); });
  } else {
    fallbackCopy(text, done);
  }
}

function itemText(item) {
  return item[0] + '\n语义：' + item[1] + '\n业务：' + item[2];
}

DATA.forEach(function(group){
  var card = document.createElement('section');
  card.className = 'card';

  var head = document.createElement('div');
  head.className = 'card-h';

  var title = document.createElement('div');
  title.className = 'card-t';
  title.textContent = group.title;
  var num = document.createElement('span');
  num.className = 'card-n';
  num.textContent = group.items.length + ' 条';
  title.appendChild(num);

  var btn = document.createElement('button');
  btn.className = 'btn';
  btn.textContent = '复制本组';

  head.appendChild(title);
  head.appendChild(btn);
  card.appendChild(head);

  var ul = document.createElement('ul');
  group.items.forEach(function(item){
    var li = document.createElement('li');

    var w = document.createElement('div');
    w.className = 'w';
    w.textContent = item[0];

    var r1 = document.createElement('div');
    r1.className = 'row';
    var t1 = document.createElement('span');
    t1.className = 'tag t1';
    t1.textContent = '语义';
    var x1 = document.createElement('span');
    x1.className = 'txt';
    x1.textContent = item[1];
    r1.appendChild(t1);
    r1.appendChild(x1);

    var r2 = document.createElement('div');
    r2.className = 'row';
    var t2 = document.createElement('span');
    t2.className = 'tag t2';
    t2.textContent = '业务';
    var x2 = document.createElement('span');
    x2.className = 'txt';
    x2.textContent = item[2];
    r2.appendChild(t2);
    r2.appendChild(x2);

    li.appendChild(w);
    li.appendChild(r1);
    li.appendChild(r2);

    li.addEventListener('click', function(){
      copyText(itemText(item), function(){ toast('已复制：' + item[0]); });
    });
    ul.appendChild(li);
  });
  card.appendChild(ul);

  btn.addEventListener('click', function(){
    var text = '【' + group.title + '】\n\n' + group.items.map(itemText).join('\n\n');
    copyText(text, function(){ toast('已复制整组：' + group.title); flash(btn, '已复制'); });
  });

  app.appendChild(card);
});

document.getElementById('copyAll').addEventListener('click', function(){
  var btn = this;
  var text = 'osSupplement/page 接口术语表\n格式：单词 / 语义 / 业务角色\n\n' + DATA.map(function(group){
    return '【' + group.title + '】\n\n' + group.items.map(itemText).join('\n\n');
  }).join('\n\n');
  copyText(text, function(){ toast('已复制全部 ' + countAll() + ' 条'); flash(btn, '已复制'); });
});

function countAll() {
  var n = 0;
  DATA.forEach(function(g){ n += g.items.length; });
  return n;
}
</script>
